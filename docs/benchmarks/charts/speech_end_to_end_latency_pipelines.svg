  <text x="410" y="418" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Key Finding: Feature 16A Overlapped Two-Pass (Pipeline C) delivers a 2.04x speedup in Endpoint-to-Transcript</text>
